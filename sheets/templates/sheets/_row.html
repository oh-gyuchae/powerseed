<tr id="row-{{ p.pk }}" class="border-t border-slate-100 hover:bg-slate-50 align-top {% if p.stage == 'declined' or p.stage == 'dropped' %}text-slate-400{% endif %}">
  {% for cell in cells %}
  <td class="px-2 py-1.5 {% if forloop.first %}sticky left-0 bg-white font-medium{% endif %} {% if cell.col.width > 20 %}max-w-64 break-all{% else %}whitespace-nowrap{% endif %}">
    {% if cell.col.key == "instagram_handle" %}<a href="{% url 'campaigns:participation' p.pk %}" class="hover:text-emerald-700">@{{ cell.value }}</a>
    {% elif cell.col.key == "account_url" or cell.col.key == "upload_url" %}{% if cell.value %}<a href="{{ cell.value }}" target="_blank" rel="noopener" class="text-emerald-700 underline">{{ cell.value }}</a>{% else %}-{% endif %}
    {% else %}{{ cell.value|default:"-"|linebreaksbr }}{% endif %}
  </td>
  {% endfor %}
  <td class="px-2 py-1.5 whitespace-nowrap">
    <button type="button" class="text-slate-500 hover:text-emerald-700"
            hx-get="{% url 'sheets:row' p.pk %}?edit=1" hx-target="closest tr" hx-swap="outerHTML">수정</button>
  </td>
</tr>
