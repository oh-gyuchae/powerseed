<div id="compose" class="space-y-2 text-sm">
  <div class="flex gap-1">
    {% for value, label in channel_choices %}
    <button type="button" hx-get="{% url 'messaging:compose' p.pk %}?channel={{ value }}" hx-target="#compose" hx-swap="outerHTML"
            class="flex-1 rounded px-2 py-1 text-xs {% if value == channel %}bg-slate-800 text-white{% else %}bg-slate-100 hover:bg-slate-200{% endif %}">{{ label }}</button>
    {% endfor %}
  </div>
  <div class="text-xs text-slate-500">받는 사람: {{ recipient|default:"(없음)" }}</div>
  {% if reason %}<div class="rounded bg-amber-50 text-amber-800 px-2 py-1.5 text-xs">{{ reason }}</div>{% endif %}

  <form method="post" action="{% url 'messaging:send' p.pk %}" class="space-y-2">
    {% csrf_token %}
    <input type="hidden" name="channel" value="{{ channel }}">
    {% if templates %}
    <select name="template" hx-get="{% url 'messaging:compose' p.pk %}" hx-include="this" hx-vals='{"channel": "{{ channel }}"}'
            hx-target="#compose" hx-swap="outerHTML" class="w-full border rounded px-2 py-1 bg-white">
      <option value="">템플릿 선택…</option>
      {% for t in templates %}<option value="{{ t.pk }}" {% if t.pk == template_id %}selected{% endif %}>{{ t.name }}</option>{% endfor %}
    </select>
    {% endif %}
    {% if supports_subject %}<input name="subject" value="{{ subject }}" maxlength="200" placeholder="메일 제목" class="w-full border rounded px-2 py-1">{% endif %}
    <textarea name="body" rows="6" placeholder="내용" class="w-full border rounded px-2 py-1">{{ body }}</textarea>
    <button {% if reason %}disabled{% endif %} class="w-full rounded py-1.5 text-white {% if reason %}bg-slate-300 cursor-not-allowed{% else %}bg-emerald-600 hover:bg-emerald-700{% endif %}">보내기</button>
  </form>
  {% if survey_link %}
  <div class="pt-1">
    <div class="text-xs text-slate-500">설문 링크 (이 인플루언서 전용)</div>
    <div class="flex gap-1">
      <input readonly value="{{ survey_link }}" class="flex-1 border rounded px-2 py-1 text-xs bg-slate-50" onclick="this.select()">
      <button type="button" class="border rounded px-2 text-xs hover:bg-slate-100"
              onclick="navigator.clipboard.writeText('{{ survey_link|escapejs }}'); this.textContent='복사됨'">복사</button>
    </div>
  </div>
  {% endif %}
</div>
