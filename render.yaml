databases:
  - name: powerseed-db
    databaseName: powerseed
    plan: basic-256mb
    region: singapore

envVarGroups:
  - name: powerseed-shared
    envVars:
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_TRUST_PROXY_SSL_HEADER
        value: "1"
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json

services:
  - type: web
    name: powerseed-web
    runtime: docker
    plan: starter  # 인스타 웹훅을 받으려면 잠들지 않는 유료 플랜 필요
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - fromGroup: powerseed-shared
      - key: DATABASE_URL
        fromDatabase:
          name: powerseed-db
          property: connectionString
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GMAIL_FROM_NAME
        value: PowerSeed
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_ACCOUNT_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: APIFY_TOKEN  # 클라우드 해시태그 수집 (cron에도 같은 값)
        sync: false

  - type: cron
    name: powerseed-sync-google-forms
    runtime: docker
    plan: starter
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    schedule: "*/10 * * * *"
    dockerCommand: sh -c "python manage.py sync_google_forms; python manage.py poll_collector_jobs"
    envVars:
      - fromGroup: powerseed-shared
      - key: DATABASE_URL
        fromDatabase:
          name: powerseed-db
          property: connectionString
      - key: APIFY_TOKEN
        sync: false
