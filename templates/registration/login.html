{% extends "base.html" %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-16 bg-white rounded-lg border border-slate-200 p-6">
  <h1 class="text-xl font-bold text-emerald-700 mb-4">PowerSeed 로그인</h1>
  {% if form.errors %}
  <p class="mb-3 text-sm text-red-600">아이디 또는 비밀번호가 올바르지 않습니다.</p>
  {% endif %}
  <form method="post" class="space-y-3">{% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label class="block text-sm">아이디
      <input name="username" autofocus required class="mt-1 w-full border rounded px-2 py-1.5">
    </label>
    <label class="block text-sm">비밀번호
      <input type="password" name="password" required class="mt-1 w-full border rounded px-2 py-1.5">
    </label>
    <button class="w-full bg-emerald-600 text-white rounded py-2 hover:bg-emerald-700">로그인</button>
  </form>
</div>
{% endblock %}
